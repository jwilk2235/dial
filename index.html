<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Call or text</title>
<style>
  :root { --bg: #1c1917; --fg: #fafaf9; --muted: #d6d3d1; --line: #57534e; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; }
  /* The whole screen is the button: one tap anywhere opens Messages or the call prompt. */
  #go { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        padding: 24px; color: var(--fg); text-decoration: none; text-align: center; -webkit-tap-highlight-color: rgba(255,255,255,.08); }
  #act { font-size: 40px; font-weight: 700; letter-spacing: -.01em; }
  #who { font-size: 22px; font-weight: 600; }
  #num { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hint { margin-top: 18px; font-size: 15px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; }
  #other { position: fixed; left: 0; right: 0; bottom: calc(24px + env(safe-area-inset-bottom)); text-align: center; color: var(--muted);
           font-size: 16px; text-decoration: underline; text-underline-offset: 3px; padding: 12px; }
</style>
</head>
<body>
<a id="go" href="#"><span id="act"></span><span id="who"></span><span id="num"></span><span id="hint">Tap anywhere</span></a>
<a id="other" href="#"></a>
<script>
// Jake's Network can't open the Phone or Messages app from inside Claude, so its Call and Text buttons open this page.
// iPhones let a page open those apps only once you tap on it, so the whole screen is one button. The number (and the
// person's name) travel after the # in the link (#sms=+13125550100&n=Name); browsers never send that part to the
// server, and this page stores nothing.
(function () {
  var m = /^(tel|sms)=(\+\d{8,15})(?:&n=([^&]{1,300}))?$/.exec(location.hash.slice(1));
  var go = document.getElementById('go'), other = document.getElementById('other');
  if (!m) { document.getElementById('act').textContent = 'No number in this link.'; document.getElementById('hint').remove(); other.remove(); go.removeAttribute('href'); return; }
  var kind = m[1], n = m[2], name = '';
  try { name = m[3] ? decodeURIComponent(m[3]) : ''; } catch (e) { name = ''; }
  var shown = n.indexOf('+1') === 0 && n.length === 12 ? '(' + n.slice(2, 5) + ') ' + n.slice(5, 8) + '-' + n.slice(8) : n;
  var first = name.split(' ')[0];
  document.getElementById('act').textContent = kind === 'sms' ? 'Text' + (first ? ' ' + first : '') : 'Call' + (first ? ' ' + first : '');
  document.getElementById('who').textContent = name && name !== first ? name : '';
  document.getElementById('num').textContent = shown;
  go.href = kind + ':' + n;
  other.href = (kind === 'sms' ? 'tel:' : 'sms:') + n;
  other.textContent = kind === 'sms' ? 'Call instead' : 'Text instead';
  document.title = (kind === 'sms' ? 'Text ' : 'Call ') + (name || shown);
  // Try to go straight there; where the phone wants the tap first, nothing happens and the page waits for it.
  try { location.replace(kind + ':' + n); } catch (e) { }
})();
</script>
</body>
</html>
